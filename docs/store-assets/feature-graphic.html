<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Mexicanario — Feature Graphic 1024×500</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #1a0800;
  }

  .canvas {
    width: 1024px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #3D0E00 0%, #8B2500 35%, #C04A00 60%, #D2691E 85%, #F8BE17 100%);
  }

  /* ── Decorative circles ── */
  .circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
  }
  .c1 { width:520px; height:520px; background:#FFE4B5; top:-180px; right:-100px; }
  .c2 { width:300px; height:300px; background:#F8BE17; bottom:-120px; left:-60px; }
  .c3 { width:180px; height:180px; background:#FF6B35; top:180px; left:80px; opacity:0.18; }

  /* ── Papel picado top strip ── */
  .picado-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    display: flex;
    align-items: flex-start;
    gap: 0;
    background: rgba(0,0,0,0.18);
    border-bottom: 3px solid rgba(248,190,23,0.4);
    overflow: hidden;
  }
  .picado-flag {
    width: 52px;
    height: 48px;
    clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
    flex-shrink: 0;
  }
  .pf0 { background: #E63946; }
  .pf1 { background: #F8BE17; }
  .pf2 { background: #2A9D8F; }
  .pf3 { background: #E76F51; }
  .pf4 { background: #9C4DC1; }
  .pf5 { background: #06D6A0; }
  .pf6 { background: #EF476F; }
  .pf7 { background: #FFB703; }
  .pf8 { background: #3A86FF; }
  .pf9 { background: #FB5607; }
  .pfa { background: #8338EC; }
  .pfb { background: #FFBE0B; }
  .pfc { background: #E63946; }
  .pfd { background: #2A9D8F; }
  .pfe { background: #E76F51; }
  .pff { background: #9C4DC1; }
  .pfg { background: #06D6A0; }
  .pfh { background: #EF476F; }
  .pfi { background: #FFB703; }
  .pfj { background: #3A86FF; }

  /* ── Bottom strip ── */
  .bottom-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg,
      #E63946 0%, #E63946 20%,
      #F8BE17 20%, #F8BE17 40%,
      #2A9D8F 40%, #2A9D8F 60%,
      #9C4DC1 60%, #9C4DC1 80%,
      #E76F51 80%, #E76F51 100%
    );
  }

  /* ── Floating emoji decorations ── */
  .deco {
    position: absolute;
    font-size: 52px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    user-select: none;
  }
  .deco-sm { font-size: 34px; }
  .deco-lg { font-size: 80px; }

  /* ── Alebrije hero ── */
  .alebrije-wrap {
    position: absolute;
    right: 40px;
    bottom: 30px;
    width: 320px;
    height: 340px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .alebrije-emoji {
    font-size: 200px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
    line-height: 1;
  }

  /* ── Main content ── */
  .content {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 580px;
  }

  .eyebrow {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #F8BE17;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .app-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 96px;
    font-weight: 900;
    color: #FFE4B5;
    line-height: 0.95;
    letter-spacing: -2px;
    text-shadow:
      0 4px 0 #8B2500,
      0 8px 0 rgba(0,0,0,0.3),
      0 0 60px rgba(248,190,23,0.4);
    margin-bottom: 14px;
  }

  .accent-bar {
    width: 80px;
    height: 5px;
    background: linear-gradient(90deg, #F8BE17, #FF6B35);
    border-radius: 3px;
    margin-bottom: 14px;
  }

  .tagline {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,228,181,0.9);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    margin-bottom: 22px;
    line-height: 1.3;
  }

  .badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(248,190,23,0.18);
    border: 1.5px solid rgba(248,190,23,0.5);
    border-radius: 30px;
    padding: 6px 16px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #FFE4B5;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }

  /* ── Marigold / floral corner ── */
  .corner-deco {
    position: absolute;
    font-size: 38px;
    opacity: 0.7;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Circles -->
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>

  <!-- Papel picado top -->
  <div class="picado-strip">
    <div class="picado-flag pf0"></div>
    <div class="picado-flag pf1"></div>
    <div class="picado-flag pf2"></div>
    <div class="picado-flag pf3"></div>
    <div class="picado-flag pf4"></div>
    <div class="picado-flag pf5"></div>
    <div class="picado-flag pf6"></div>
    <div class="picado-flag pf7"></div>
    <div class="picado-flag pf8"></div>
    <div class="picado-flag pf9"></div>
    <div class="picado-flag pfa"></div>
    <div class="picado-flag pfb"></div>
    <div class="picado-flag pfc"></div>
    <div class="picado-flag pfd"></div>
    <div class="picado-flag pfe"></div>
    <div class="picado-flag pff"></div>
    <div class="picado-flag pfg"></div>
    <div class="picado-flag pfh"></div>
    <div class="picado-flag pfi"></div>
    <div class="picado-flag pfj"></div>
  </div>

  <!-- Floating decorations -->
  <div class="deco" style="top:58px; left:20px; opacity:0.55;">🌮</div>
  <div class="deco deco-sm" style="top:62px; right:380px; opacity:0.5;">🌶️</div>
  <div class="deco deco-sm" style="bottom:90px; left:22px; opacity:0.45;">🌼</div>
  <div class="deco deco-sm" style="top:68px; left:200px; opacity:0.4;">🪙</div>
  <div class="deco deco-sm" style="bottom:60px; right:370px; opacity:0.45;">💀</div>
  <div class="deco deco-sm" style="top:60px; right:430px; opacity:0.4;">🎺</div>

  <!-- Alebrije hero -->
  <div class="alebrije-wrap">
    <div class="alebrije-emoji">🦎</div>
  </div>

  <!-- Floral corner accents -->
  <div class="corner-deco" style="bottom:8px; right:10px;">🌸</div>
  <div class="corner-deco" style="bottom:8px; right:52px; font-size:28px; opacity:0.5;">🌺</div>

  <!-- Main content -->
  <div class="content">
    <div class="eyebrow">🇲🇽 &nbsp;El juego de modismos</div>
    <div class="app-name">Mexicanario</div>
    <div class="accent-bar"></div>
    <div class="tagline">Aprende modismos y cultura mexicana<br>mientras cuidas tu mascota 🌮</div>
    <div class="badges">
      <div class="badge">🗺️ Mapa por zonas</div>
      <div class="badge">🦎 Mascotas</div>
      <div class="badge">📊 Mexicanómetro</div>
      <div class="badge">🎯 Misiones diarias</div>
    </div>
  </div>

  <!-- Bottom stripe -->
  <div class="bottom-strip"></div>

</div>
</body>
</html>
